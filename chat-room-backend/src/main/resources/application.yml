spring:
  config:
    # Local-only secrets file (excluded from git). Optional: falls back to env vars when absent.
    # 两条相对路径适配不同启动目录：
    #   ./config/local-secrets.yml          —— 从 chat-room-backend 目录启动（IDE/终端）
    #   chat-room-backend/config/...        —— 从项目根目录 chatroom 启动（java -jar）
    import:
      - optional:file:./config/local-secrets.yml
      - optional:file:chat-room-backend/config/local-secrets.yml
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chat_room?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/mysql
    user: ${DB_MIGRATOR_USERNAME}
    password: ${DB_MIGRATOR_PASSWORD}
    clean-disabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

app:
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
